name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Updater regression tests
        run: |
          bash -n scripts/update.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Real updater smoke test
        shell: bash
        env:
          LOG_FILE: ${{ runner.temp }}/updater-smoke-hashes.log
          VERIFY_BUILDS: "0"
          RUN_VM_TEST: "0"
        run: |
          set -euo pipefail
          target="$(sed -n 's/^[[:space:]]*version = "\([^"]*\)";/\1/p' flake.nix | head -n1)"
          test -n "$target"
          worktree="$(mktemp -d "$RUNNER_TEMP/updater-smoke.XXXXXX")"
          git worktree add --detach "$worktree" HEAD
          trap 'git worktree remove --force "$worktree"' EXIT
          (
            cd "$worktree"
            # Force the update path without changing the checkout tested below.
            sed -i -E 's/^( *version = )"[^"]+";/\1"0.0.0";/' flake.nix
            bash scripts/update.sh --version "$target" </dev/null
            ! grep -q 'lib\.fakeHash' packages/multica-{cli,server,web}.nix
          ) 2>&1 | tee "$RUNNER_TEMP/updater-smoke.log"

      - name: nix flake check
        shell: bash
        run: |
          set -euo pipefail
          nix flake check --keep-going --print-build-logs 2>&1 | tee "$RUNNER_TEMP/flake-check.log"

      - name: Upload failed check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake-check-log
          path: |
            ${{ runner.temp }}/flake-check.log
            ${{ runner.temp }}/updater-smoke.log
            ${{ runner.temp }}/updater-smoke-hashes.log
          if-no-files-found: ignore
