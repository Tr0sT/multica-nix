name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check
        shell: bash
        run: |
          set -euo pipefail
          nix flake check --keep-going --print-build-logs 2>&1 | tee "$RUNNER_TEMP/flake-check.log"

      - name: Upload failed flake check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake-check-log
          path: ${{ runner.temp }}/flake-check.log
          if-no-files-found: ignore
